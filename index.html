<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<title>ポケチャン対戦ノート</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#fff;--bg2:#f5f5f5;--text:#111;--text2:#555;--text3:#999;--bd:#ddd;--bd2:#bbb;--green:#3b7a1e;--gbg:#eaf3de;--red:#a32d2d;--rbg:#fcebeb;--r:10px;--rs:6px;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:15px;}
.tabs{display:flex;border-bottom:1px solid var(--bd);background:var(--bg);position:sticky;top:0;z-index:10;}
.tab{flex:1;padding:12px 4px;font-size:13px;text-align:center;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;}
.tab.on{color:var(--text);border-bottom-color:var(--text);font-weight:600;}
.sec{display:none;padding:14px 12px 80px;}
.sec.on{display:block;}
.lbl{font-size:12px;color:var(--text2);margin-bottom:4px;margin-top:10px;display:block;}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn{width:100%;padding:12px;font-size:15px;font-weight:600;border-radius:var(--r);border:1px solid var(--bd);background:var(--bg2);color:var(--text);cursor:pointer;margin-top:10px;}
.btn:active{opacity:.7;}
.btnp{background:var(--text);color:var(--bg);}
.card{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;}
.pc{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;cursor:pointer;}
.pc.sel{border-color:#333;background:var(--bg2);}
.pn{font-size:15px;font-weight:600;}
.ps{font-size:12px;color:var(--text2);margin-top:2px;line-height:1.5;}
.dot{width:12px;height:12px;border-radius:50%;background:var(--bd);flex-shrink:0;}
.dot.on{background:var(--green);}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;}
.chip{font-size:13px;padding:7px 14px;border-radius:99px;border:1px solid var(--bd);color:var(--text2);cursor:pointer;background:var(--bg);}
.chip.on{background:var(--bg2);color:var(--text);border-color:var(--bd2);font-weight:600;}
.tb{border:1px solid var(--bd);border-radius:var(--r);padding:12px;margin-bottom:10px;}
.thd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.tn{font-size:13px;font-weight:600;color:var(--text2);}
.xb{background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer;padding:0;width:auto;}
.rb{background:var(--bg2);border-radius:var(--r);padding:14px;font-size:14px;line-height:1.9;color:var(--text);white-space:pre-wrap;margin-top:10px;}
.spin{display:inline-block;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.badge{display:inline-block;font-size:12px;padding:3px 10px;border-radius:99px;font-weight:600;margin-right:6px;}
.bw{background:var(--gbg);color:var(--green);}
.bl{background:var(--rbg);color:var(--red);}
.bd{background:var(--bg2);color:var(--text2);}
.hi{border-bottom:1px solid var(--bd);padding:12px 0;}
.hi:last-child{border-bottom:none;}
.eh{text-align:center;color:var(--text3);font-size:14px;padding:2rem 0;}
.sttl{font-size:14px;font-weight:600;margin-bottom:10px;}
.abar{background:var(--bg2);border-bottom:1px solid var(--bd);padding:10px 12px;display:flex;gap:8px;align-items:center;}
.abar input{flex:1;font-size:13px;padding:7px 10px;border:1px solid var(--bd);border-radius:var(--rs);background:var(--bg);color:var(--text);}
.abar button{white-space:nowrap;padding:7px 14px;font-size:13px;border:1px solid var(--bd);border-radius:var(--rs);background:var(--bg);color:var(--text);cursor:pointer;font-weight:600;}
.sok{color:var(--green);font-size:12px;padding:4px 12px;display:none;}
.ss{position:relative;margin-bottom:4px;}
.ss input{width:100%;font-size:15px;padding:10px 12px;border:1px solid var(--bd);border-radius:var(--rs);background:var(--bg);color:var(--text);}
.ss input:focus{outline:none;border-color:var(--bd2);}
.ss input:disabled{color:var(--text3);background:var(--bg2);}
.drop{position:absolute;top:100%;left:0;right:0;background:var(--bg);border:1px solid var(--bd2);border-radius:var(--rs);max-height:200px;overflow-y:auto;z-index:200;display:none;box-shadow:0 4px 12px rgba(0,0,0,.12);}
.drop.open{display:block;}
.di{padding:10px 12px;font-size:14px;cursor:pointer;border-bottom:1px solid var(--bd);}
.di:last-child{border-bottom:none;}
.di:active{background:var(--bg2);}
textarea{width:100%;font-size:15px;padding:10px 12px;border:1px solid var(--bd);border-radius:var(--rs);background:var(--bg);color:var(--text);margin-bottom:4px;resize:none;line-height:1.5;}
textarea:focus{outline:none;border-color:var(--bd2);}
</style>
</head>
<body>
<div class="abar">
  <input type="password" id="akey" placeholder="Anthropic APIキー（sk-ant-...）">
  <button onclick="saveKey()">保存</button>
</div>
<div class="sok" id="sok">保存しました</div>
<div class="tabs">
  <div class="tab on" onclick="sw('party')">パーティ</div>
  <div class="tab" onclick="sw('battle')">対戦中</div>
  <div class="tab" onclick="sw('fb')">フィードバック</div>
</div>

<div id="party" class="sec on">
  <div id="plit"><div class="eh">ポケモンを登録してください</div></div>
  <div class="card">
    <div class="sttl">ポケモンを追加</div>
    <span class="lbl">名前</span>
    <div class="ss" id="ss-pn">
      <input type="text" placeholder="検索して選択（例：ミミッキュ）" oninput="fd('ss-pn',this.value,PK)" onfocus="fd('ss-pn',this.value,PK)" onblur="cd('ss-pn')" autocomplete="off">
      <div class="drop" id="drop-ss-pn"></div>
    </div>
    <div class="r2">
      <div>
        <span class="lbl">持ち物</span>
        <div class="ss" id="ss-it">
          <input type="text" placeholder="検索して選択" oninput="fd('ss-it',this.value,IT)" onfocus="fd('ss-it',this.value,IT)" onblur="cd('ss-it')" autocomplete="off">
          <div class="drop" id="drop-ss-it"></div>
        </div>
      </div>
      <div>
        <span class="lbl">性格</span>
        <div class="ss" id="ss-na">
          <input type="text" placeholder="選択" oninput="fd('ss-na',this.value,NA)" onfocus="fd('ss-na',this.value,NA)" onblur="cd('ss-na')" autocomplete="off">
          <div class="drop" id="drop-ss-na"></div>
        </div>
      </div>
    </div>
    <span class="lbl">技（カンマ区切り）</span>
    <input type="text" id="pmv" placeholder="例：シャドークロー,じゃれつく,呪い,影うち" style="width:100%;font-size:15px;padding:10px 12px;border:1px solid var(--bd);border-radius:var(--rs);background:var(--bg);color:var(--text);margin-bottom:4px;">
    <span class="lbl">役割（省略OK）</span>
    <input type="text" id="pro" placeholder="例：積みエース" style="width:100%;font-size:15px;padding:10px 12px;border:1px solid var(--bd);border-radius:var(--rs);background:var(--bg);color:var(--text);margin-bottom:4px;">
    <button class="btn" onclick="addP()">+ 追加する</button>
  </div>
</div>

<div id="battle" class="sec">
  <div class="sttl">1. 選出する3匹を選択</div>
  <div id="slist"></div>
  <div style="margin:12px 0;">
    <span class="lbl">結果</span>
    <div class="chips">
      <span class="chip on" id="rw" onclick="setR('win')">勝ち</span>
      <span class="chip" id="rl" onclick="setR('lose')">負け</span>
      <span class="chip" id="rd" onclick="setR('draw')">引き分け</span>
    </div>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
    <div class="sttl" style="margin:0;">2. ターンを記録</div>
    <button onclick="addT()" style="width:auto;padding:6px 14px;font-size:13px;border:1px dashed var(--bd2);border-radius:var(--rs);background:none;color:var(--text2);cursor:pointer;font-weight:600;">+ ターン追加</button>
  </div>
  <div id="turns"></div>
  <button class="btn btnp" onclick="save()">保存してフィードバックへ</button>
</div>

<div id="fb" class="sec">
  <div id="fbe" class="eh">対戦を記録するとここに表示されます</div>
  <div id="fbc" style="display:none;">
    <div id="fbs" class="card" style="font-size:14px;line-height:1.7;"></div>
    <button class="btn btnp" onclick="runFB()">AIコーチにフィードバックしてもらう</button>
    <div id="fbr"></div>
  </div>
  <div id="hw" style="margin-top:20px;"></div>
</div>

<script>
const PK=['フシギバナ','メガフシギバナ','リザードン','メガリザードンX','メガリザードンY','カメックス','メガカメックス','スピアー','メガスピアー','ピジョット','メガピジョット','アーボック','ピカチュウ','ライチュウ','アローラライチュウ','ピクシー','メガピクシー','キュウコン','アローラキュウコン','ウインディ','ヒスイウインディ','フーディン','メガフーディン','カイリキー','ウツボット','メガウツボット','ヤドラン','ガラルヤドラン','メガヤドラン','ゲンガー','メガゲンガー','ガルーラ','メガガルーラ','スターミー','メガスターミー','カイロス','メガカイロス','ケンタロス','ガラルケンタロス','ギャラドス','メガギャラドス','メタモン','シャワーズ','サンダース','ブースター','プテラ','メガプテラ','カビゴン','カイリュー','メガカイリュー',
'メガニウム','バクフーン','オーダイル','メガオーダイル','アリアドス','メガアリアドス','デンリュウ','メガデンリュウ','マリルリ','ヤドキング','フォレトス','ハガネール','メガハガネール','ハッサム','メガハッサム','ヘラクロス','メガヘラクロス','エアームド','メガエアームド','ヘルガー','メガヘルガー','バンギラス','メガバンギラス',
'ペリッパー','サーナイト','メガサーナイト','ヤミラミ','メガヤミラミ','ボスゴドラ','メガボスゴドラ','チャーレム','メガチャーレム','ライボルト','メガライボルト','サメハダー','メガサメハダー','バクーダ','メガバクーダ','チルタリス','メガチルタリス','ミロカロス','ジュペッタ','メガジュペッタ','チリーン','メガチリーン','アブソル','メガアブソル','オニゴーリ','メガオニゴーリ',
'エンペルト','ドダイトス','ゴウカザル','ルクシオ','ロズレイド','ラムパルド','トリデプス','ミミロップ','メガミミロップ','スピリトーム','ガブリアス','メガガブリアス','ルカリオ','メガルカリオ','カバルドン','ドサイドン','リーフィア','グレイシア','グライオン','メガグライオン','マンムー','エルレイド','メガエルレイド','ユキノオー','メガユキノオー','マニューラ','フロストロトム',
'ガマゲロゲ','ダゲキ','シンボラー','デスカーン','アーケオス','バイバニラ','ランクルス','オノノクス','アイアント','ゴルーグ','エンブオー','メガエンブオー',
'クワガノン','ルガルガン（まひるのすがた）','ルガルガン（まよなかのすがた）','アシレーヌ','メガアシレーヌ','ガオガエン','ジャラランガ','ドヒドイデ','ハバタクカミ','テツノカシラ','テツノブジン','パオジアン','ディンルー','チヲハウハネ','イダイナキバ',
'アーマーガア','コオリッポ','ストリンダー','ドラパルト','タチフサグマ','パッチラゴン',
'マスカーニャ','ウェルカモ','ラウドボーン','ミミッキュ','ウルガモス','ウォーグル','マフォクシー','メガマフォクシー','ゲッコウガ','メガゲッコウガ','グレンアルマ','キョジオーン','セグレイブ','ドドゲザン','ガケガニ','タイカイデン','コノヨザル','ヘイラッシャ','スコヴィランド','サーフゴー','キラフロル','カイナックル','フリージオ','フラージュ','メガフラージュ'];

const IT=['なし','こだわりスカーフ','こだわりメガネ','こだわりハチマキ','いのちのたま','たつじんのおび','きあいのタスキ','きあいのハチマキ','オボンのみ','ラムのみ','カゴのみ','クラボのみ','モモンのみ','チーゴのみ','ナナシのみ','ヒメリのみ','オレンのみ','キーのみ','オッカのみ','イトケのみ','ソクノのみ','リンドのみ','ヤチェのみ','ヨプのみ','ビアーのみ','シュカのみ','バコウのみ','ウタンのみ','タンガのみ','ヨロギのみ','カシブのみ','ハバンのみ','ナモのみ','リリバのみ','ロゼルのみ','ホズのみ','とつげきチョッキ','ひかりのねんど','じゃくてんほけん','ふうせん','するどいツメ','くろいてっきゅう','しんかのきせき','でんきだま','たべのこし','くろいヘドロ','かいがらのすず','おうじゃのしるし','せんせいのツメ','ひかりのこな','ピントレンズ','メンタルハーブ','しろいハーブ','パワフルハーブ','もくたん','しんぴのしずく','じしゃく','とけないこおり','やわらかいすな','ようせいのハネ','くろいメガネ','くろおび','どくバリ','かたいいし','ぎんのこな','まがったスプーン','するどいくちばし','シルクのスカーフ','のろいのおふだ','りゅうのキバ','メタルコート','きせきのタネ',
'アブソルナイト','ウツボットナイト','エアームドナイト','エルレイドナイト','エンブオナイト','オーダイルナイト','オニゴーリナイト','カイリュナイト','カイロスナイト','ガブリアスナイト','ガルーラナイト','グライオナイト','ゲンガーナイト','サーナイトナイト','サメハダーナイト','スターミーナイト','スピアーナイト','チャーレムナイト','チルタリスナイト','デンリュウナイト','バクーダナイト','バンギラスナイト','ハッサムナイト','ハガネールナイト','ハンテールナイト','ヘラクロスナイト','ヘルガーナイト','ボスゴドラナイト','マフォクシーナイト','ミミロップナイト','ユキノオーナイト','ヤドランナイト','ヤミラミナイト','ライボルトナイト','ルカリオナイト','フシギバナナイト','フーディンナイト','ジュペッタナイト','ピジョットナイト','ピクシーナイト','リザードナイトX','リザードナイトY','カメックスナイト','メガハッサムナイト','メガアリアドスナイト','アシレーヌナイト','ゲッコウガナイト','フラージュナイト','メガアブソルナイト'];

const NA=['さむがり（攻↑防↓）','ひかえめ（特攻↑攻↓）','おくびょう（素早↑攻↓）','せっかち（素早↑特防↓）','うっかりや（素早↑特攻↓）','やんちゃ（攻↑特防↓）','いじっぱり（攻↑特攻↓）','わんぱく（防↑攻↓）','のんき（防↑素早↓）','ずぶとい（防↑特攻↓）','おだやか（特防↑攻↓）','おとなしい（特防↑素早↓）','しんちょう（特防↑特攻↓）','なまいき（特防↑素早↓）','てれや（特攻↑攻↓）','おっとり（特攻↑防↓）','うかつ（特攻↑特防↓）','れいせい（特攻↑素早↓）','ようき（素早↑特攻↓）','おうような（特防↑防↓）','まじめ（補正なし）','すなお（補正なし）','がんばりや（補正なし）','きまぐれ（補正なし）','しっかり（補正なし）'];

let sv={},party=JSON.parse(localStorage.getItem('pcp')||'[]'),battles=JSON.parse(localStorage.getItem('pcb')||'[]');
let sentIdx=[],result='win',turns=[],tn=0,cb=null;

function fd(id,q,list){
  const d=document.getElementById('drop-'+id);
  const f=q?list.filter(v=>v.includes(q)):list;
  d.innerHTML=f.map(v=>`<div class="di" onmousedown="sd('${id}','${v.replace(/'/g,"\\'")}')">${v}</div>`).join('');
  d.classList.add('open');
}
function cd(id){setTimeout(()=>document.getElementById('drop-'+id).classList.remove('open'),150);}
function sd(id,val){sv[id]=val;document.querySelector('#'+id+' input').value=val;document.getElementById('drop-'+id).classList.remove('open');}

function tfd(id,q,list,fn){
  const d=document.getElementById('drop-'+id);if(!d)return;
  const f=q?list.filter(v=>v.includes(q)):list;
  d.innerHTML=f.map(v=>`<div class="di" onmousedown="${fn}('${id}','${v.replace(/'/g,"\\'")}')">  ${v}</div>`).join('');
  d.classList.add('open');
}
function tcd(id){setTimeout(()=>document.getElementById('drop-'+id)?.classList.remove('open'),150);}

window.onload=()=>{const k=localStorage.getItem('pcak');if(k)document.getElementById('akey').value=k;renderP();};

function saveKey(){const k=document.getElementById('akey').value.trim();if(!k)return;localStorage.setItem('pcak',k);const s=document.getElementById('sok');s.style.display='block';setTimeout(()=>s.style.display='none',2000);}

function sw(id){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('on',['party','battle','fb'][i]===id));
  document.querySelectorAll('.sec').forEach(s=>s.classList.toggle('on',s.id===id));
  if(id==='battle'){sentIdx=[];renderSL();}
  if(id==='fb')renderH();
}

function addP(){
  const name=sv['ss-pn']||document.querySelector('#ss-pn input').value.trim();
  if(!name){alert('ポケモン名を入力してください');return;}
  if(party.length>=6){alert('6匹までです');return;}
  party.push({name,item:sv['ss-it']||document.querySelector('#ss-it input').value.trim(),nature:sv['ss-na']||document.querySelector('#ss-na input').value.trim(),moves:document.getElementById('pmv').value.split(',').map(m=>m.trim()).filter(Boolean),role:document.getElementById('pro').value.trim()});
  ['ss-pn','ss-it','ss-na'].forEach(id=>{document.querySelector('#'+id+' input').value='';sv[id]='';});
  document.getElementById('pmv').value='';document.getElementById('pro').value='';
  localStorage.setItem('pcp',JSON.stringify(party));renderP();
}

function rmP(i){party.splice(i,1);localStorage.setItem('pcp',JSON.stringify(party));renderP();}

function renderP(){
  const el=document.getElementById('plit');
  if(!party.length){el.innerHTML='<div class="eh">ポケモンを登録してください</div>';return;}
  el.innerHTML=party.map((p,i)=>`<div class="pc" style="cursor:default;"><div style="flex:1;"><div class="pn">${p.name}</div><div class="ps">${[p.item,p.nature].filter(Boolean).join(' / ')}</div>${p.moves.length?`<div class="ps">${p.moves.join('　')}</div>`:''} ${p.role?`<div class="ps" style="color:var(--text3);">${p.role}</div>`:''}</div><button class="xb" onclick="rmP(${i})">×</button></div>`).join('');
}

function renderSL(){
  const el=document.getElementById('slist');
  if(!party.length){el.innerHTML='<div class="eh">先にパーティを登録してください</div>';return;}
  el.innerHTML=party.map((p,i)=>`<div class="pc ${sentIdx.includes(i)?'sel':''}" onclick="togS(${i})"><div class="dot ${sentIdx.includes(i)?'on':''}"></div><div style="flex:1;"><div class="pn">${p.name}</div><div class="ps">${[p.item,p.nature].filter(Boolean).join(' / ')}</div></div>${sentIdx.includes(i)?`<span style="font-size:13px;color:var(--text2);font-weight:600;">${sentIdx.indexOf(i)+1}番手</span>`:''}</div>`).join('');
}

function togS(i){const x=sentIdx.indexOf(i);if(x===-1){if(sentIdx.length<3)sentIdx.push(i);}else sentIdx.splice(x,1);renderSL();}
function setR(r){result=r;['win','lose','draw'].forEach(k=>document.getElementById('r'+k[0]).classList.toggle('on',k===r));}

function addT(){
  tn++;const n=tn;
  turns.push({id:n,myPoke:'',move:'',oppPoke:'',oppMove:'',note:''});
  const div=document.createElement('div');
  div.className='tb';div.id='tb-'+n;
  const sp=sentIdx.map(i=>party[i]);
  div.innerHTML=`<div class="thd"><span class="tn">ターン ${n}</span><button class="xb" onclick="rmT(${n})">×</button></div>
  <div class="r2">
    <div><span class="lbl">自分のポケモン</span>
      <div class="ss" id="smy${n}">
        <input type="text" placeholder="選択" oninput="tfd('smy${n}',this.value,sentIdx.map(i=>party[i]).map(p=>p.name),'cmy${n}')" onfocus="tfd('smy${n}',this.value,sentIdx.map(i=>party[i]).map(p=>p.name),'cmy${n}')" onblur="tcd('smy${n}')" autocomplete="off">
        <div class="drop" id="drop-smy${n}"></div>
      </div>
    </div>
    <div><span class="lbl">使った技</span>
      <div class="ss" id="smv${n}">
        <input type="text" placeholder="先にポケモン選択" disabled oninput="tfd('smv${n}',this.value,(party.find(p=>p.name===sv['smy${n}'])||{moves:[]}).moves,'cmv${n}')" onfocus="tfd('smv${n}',this.value,(party.find(p=>p.name===sv['smy${n}'])||{moves:[]}).moves,'cmv${n}')" onblur="tcd('smv${n}')">
        <div class="drop" id="drop-smv${n}"></div>
      </div>
    </div>
  </div>
  <div class="r2">
    <div><span class="lbl">相手のポケモン</span>
      <div class="ss" id="sop${n}">
        <input type="text" placeholder="検索して選択" oninput="tfd('sop${n}',this.value,PK,'cop${n}')" onfocus="tfd('sop${n}',this.value,PK,'cop${n}')" onblur="tcd('sop${n}')" autocomplete="off">
        <div class="drop" id="drop-sop${n}"></div>
      </div>
    </div>
    <div><span class="lbl">相手の行動</span>
      <input type="text" id="sopm${n}" placeholder="例：地震,剣の舞" oninput="stN(${n})" style="width:100%;font-size:15px;padding:10px 12px;border:1px solid var(--bd);border-radius:var(--rs);background:var(--bg);color:var(--text);margin-bottom:4px;">
    </div>
  </div>
  <span class="lbl">メモ（省略OK）</span>
  <textarea rows="2" placeholder="例：スカーフ読んで先制できると思った" oninput="stN2(${n},this.value)"></textarea>`;
  document.getElementById('turns').appendChild(div);

  window['cmy'+n]=(id,val)=>{sv[id]=val;document.querySelector('#'+id+' input').value=val;document.getElementById('drop-'+id)?.classList.remove('open');const t=turns.find(t=>t.id===n);if(t)t.myPoke=val;const pk=party.find(p=>p.name===val);const mi=document.querySelector('#smv'+n+' input');if(mi){mi.disabled=false;mi.placeholder='技を選択';}if(pk){const md=document.getElementById('drop-smv'+n);if(md)md.innerHTML=pk.moves.map(v=>`<div class="di" onmousedown="cmv${n}('smv${n}','${v.replace(/'/g,"\\'")}')">  ${v}</div>`).join('');}};
  window['cmv'+n]=(id,val)=>{sv[id]=val;const i=document.querySelector('#'+id+' input');if(i)i.value=val;document.getElementById('drop-'+id)?.classList.remove('open');const t=turns.find(t=>t.id===n);if(t)t.move=val;};
  window['cop'+n]=(id,val)=>{sv[id]=val;const i=document.querySelector('#'+id+' input');if(i)i.value=val;document.getElementById('drop-'+id)?.classList.remove('open');const t=turns.find(t=>t.id===n);if(t)t.oppPoke=val;};

  tfd('smy'+n,'',sp.map(p=>p.name),'cmy'+n);document.getElementById('drop-smy'+n).classList.remove('open');
  tfd('sop'+n,'',PK,'cop'+n);document.getElementById('drop-sop'+n).classList.remove('open');
  div.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function stN(n){const t=turns.find(t=>t.id===n);if(t)t.oppMove=document.getElementById('sopm'+n)?.value||'';}
function stN2(n,v){const t=turns.find(t=>t.id===n);if(t)t.note=v;}
function rmT(n){turns=turns.filter(t=>t.id!==n);document.getElementById('tb-'+n)?.remove();}

function save(){
  turns.forEach(t=>{
    t.myPoke=sv['smy'+t.id]||document.querySelector('#smy'+t.id+' input')?.value||'';
    t.move=sv['smv'+t.id]||document.querySelector('#smv'+t.id+' input')?.value||'';
    t.oppPoke=sv['sop'+t.id]||document.querySelector('#sop'+t.id+' input')?.value||'';
  });
  const b={id:Date.now(),date:new Date().toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}),result,sent:sentIdx.map(i=>party[i]),party:party.map(p=>({...p,moves:[...p.moves]})),turns:turns.filter(t=>t.myPoke||t.oppPoke||t.move)};
  battles.unshift(b);if(battles.length>50)battles=battles.slice(0,50);
  localStorage.setItem('pcb',JSON.stringify(battles));
  cb=b;document.getElementById('turns').innerHTML='';turns=[];tn=0;sentIdx=[];
  showFB(b);sw('fb');
}

function showFB(b){
  document.getElementById('fbe').style.display='none';
  document.getElementById('fbc').style.display='block';
  document.getElementById('fbr').innerHTML='';
  const rl={win:'勝ち',lose:'負け',draw:'引き分け'};
  const rc={win:'bw',lose:'bl',draw:'bd'};
  document.getElementById('fbs').innerHTML=`<span class="badge ${rc[b.result]}">${rl[b.result]}</span>${b.sent.length?'選出：'+b.sent.map(p=>p.name).join('、')+'　':''}${b.turns.length}ターン記録　${b.date}`;
}

const KN=`【ポケモンチャンピオンズ 対戦コーチ専用知識ベース】

■ゲームシステム
- 個体値(IV)廃止。全ポケモン最大値固定
- SP（ステータスポイント）で育成：各能力0〜32、合計66まで振り分け
- 性格補正：上昇×1.1 / 低下×0.9（例：いじっぱりは攻↑特攻↓）
- メガシンカが主要ギミック（メガストーンを持たせて1試合1回）
- 6匹パーティから3匹選出、シングルバトルが基本

■タイプ相性（重要）
- ドラゴン：こおり・ドラゴン・フェアリーで弱点
- ゴースト：ゴースト・あくで弱点、ノーマル・かくとうは無効
- はがね：ほのお・かくとう・じめんで弱点、どく無効
- フェアリー：どく・はがねで弱点、ドラゴン無効
- じめん：みず・くさ・こおりで弱点、でんき無効
- ほのお：みず・じめん・いわで弱点
- みず：でんき・くさで弱点

■よく使われる持ち物の効果
- こだわりスカーフ：素早さ×1.5だが技が固定
- こだわりメガネ：特攻×1.5だが技が固定
- こだわりハチマキ：攻撃×1.5だが技が固定
- いのちのたま：ダメージ×1.3だが毎ターンHP減少
- きあいのタスキ：HP満タン時に一撃を耐える
- オボンのみ：HP半分以下でHP1/4回復
- とつげきチョッキ：特防×1.5だが変化技使用不可

■初心者がやりがちなミス
- 弱点を突けない技を選ぶ
- 積み技（剣の舞・竜の舞など）のタイミングが早すぎ/遅すぎ
- 不利対面で交代せず攻撃してしまう（相手の弱点を突かれる状況）
- 相手のメガシンカを忘れて計算が狂う
- HP少ない相手に命中不安な技を使って外す

■行動判断の基本
- 不利対面（こちらが弱点を突かれる）→ 交代が基本
- 有利対面（相手の弱点を突ける）→ 弱点技を打つ or 積み技で積む
- 相手が積み技を使ってきた → 挑発・高火力技・超速ポケモンで対処
- 相手のHPが少ない → 確実に倒せる技を選ぶ（外しリスク回避）
- スカーフ持ちと読める時 → 交代で安全に受け出し

■強いポケモンと対策
- メガゲンガー：かげふみ+みちづれが脅威。あく技・高速ゴースト技で対策
- ガブリアス：高速高火力、地震が強力。こおり技（4倍弱点）・ドラゴン技で対策
- ミミッキュ：ばけのかわで1発耐える。呪いで削る戦術も。鋼技で対策
- ハバタクカミ：フェアリー・ゴースト複合で特殊高火力。はがね・どく技有効
- カイリュー：マルチスケイル持ち、竜の舞から高火力。こおり技有効
- メガハッサム：テクニシャン+バレットパンチが強力。ほのお・いわ技で対策
- メガゲッコウガ：へんげんじざい+高速で技範囲が広い。体が弱いので先制技有効`;

async function fetchLiveInfo(b) {
  const ak = localStorage.getItem('pcak');
  if (!ak) return '';
  try {
    // 相手のポケモン名を収集
    const oppPokes = [...new Set(b.turns.map(t => t.oppPoke).filter(Boolean))];
    const sentPokes = b.sent.map(p => p.name);

    // Claude web_search toolで攻略情報を取得
    const searchPrompt = `ポケモンチャンピオンズの最新情報を検索して以下を教えてください：
1. 現在の使用率ランキング上位10匹（シングルバトル）
2. 以下のポケモンの対策方法と注意点：${[...oppPokes,...sentPokes].join('、')}
できるだけ最新の環境情報を含めてください。`;

    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {'Content-Type':'application/json','x-api-key':ak,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        tools: [{"type":"web_search_20250305","name":"web_search"}],
        messages: [{role:'user', content: searchPrompt}]
      })
    });
    const data = await res.json();
    const text = data.content?.filter(c=>c.type==='text').map(c=>c.text).join('\n') || '';
    return text ? `\n\n【リアルタイム環境情報】\n${text}` : '';
  } catch(e) {
    return '';
  }
}

async function runFB(){
  const ak=localStorage.getItem('pcak');
  if(!ak){alert('APIキーを画面上部に入力して保存してください');return;}
  if(!cb)return;
  const b=cb;const el=document.getElementById('fbr');
  el.innerHTML='<div class="rb"><span class="spin">⟳</span> 最新の環境情報を取得中...</div>';

  // リアルタイムで攻略情報を取得
  const liveInfo = await fetchLiveInfo(b);
  el.innerHTML='<div class="rb"><span class="spin">⟳</span> AIコーチが分析中...</div>';

  const rl={win:'勝ち',lose:'負け',draw:'引き分け'};
  const pt=b.party.map(p=>`・${p.name}（持ち物：${p.item||'なし'}、性格：${p.nature||'不明'}、技：${p.moves.join('/')||'不明'}、役割：${p.role||'不明'}）`).join('\n');
  const st=b.sent.map(p=>`${p.name}（${[p.item,p.nature].filter(Boolean).join('・')}）`).join('、');
  const tt=b.turns.map(t=>`T${t.id}：自分=${t.myPoke||'?'}で${t.move||'?'} / 相手=${t.oppPoke||'?'}${t.oppMove?'で'+t.oppMove:''}${t.note?'　メモ：'+t.note:''}`).join('\n');
  const prompt=`${KN}${liveInfo}\n\nあなたはポケモンチャンピオンズの対戦コーチです。上記の知識と最新の環境情報を踏まえて初心者プレイヤーの対戦を振り返ってください。\n\n【対戦結果】${rl[b.result]}\n【自分のパーティ】\n${pt}\n【今回の選出】${st||'不明'}\n【ターンの流れ】\n${tt||'記録なし'}\n\n以下の形式で、専門用語は使わず「なるほど！」と思えるやさしい言葉でフィードバックしてください：\n\n▼ ターンごとの行動について\n各ターンの自分の行動が良かった点・改善できる点をゲームの知識（タイプ相性・持ち物効果・現在の環境など）を使って一言ずつ。相手の行動も考慮してコメントしてください\n\n▼ 選出について\nその3匹の選出が良かった点、または改善できる点を具体的に（持ち物・性格・現在の環境も踏まえて）\n\n▼ 次の対戦で1つだけ意識すること\n初心者が次にステップアップできる具体的なアドバイスを1つだけ`;
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':ak,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1200,messages:[{role:'user',content:prompt}]})});
    const data=await res.json();
    if(data.error){el.innerHTML=`<div class="rb">エラー：${data.error.message}</div>`;return;}
    const text=data.content?.find(c=>c.type==='text')?.text||'エラー';
    el.innerHTML=`<div class="rb">${text}</div>`;
    battles[0].feedback=text;localStorage.setItem('pcb',JSON.stringify(battles));
  }catch(e){el.innerHTML='<div class="rb">通信エラーが発生しました。</div>';}
}

function renderH(){
  const el=document.getElementById('hw');
  const ts=battles.slice(cb?1:0);
  if(!ts.length){el.innerHTML='';return;}
  const rl={win:'勝ち',lose:'負け',draw:'引き分け'};
  const rc={win:'bw',lose:'bl',draw:'bd'};
  el.innerHTML='<div style="font-size:13px;color:var(--text3);margin-bottom:8px;">過去の対戦</div>'+ts.map((b,i)=>`<div class="hi"><span class="badge ${rc[b.result]}">${rl[b.result]}</span><span style="font-size:14px;">選出：${b.sent.map(p=>p.name).join('、')||'不明'}</span><span style="font-size:12px;color:var(--text3);margin-left:6px;">${b.date}</span><div><button onclick="repFB(${cb?i+1:i})" style="margin-top:8px;width:auto;padding:5px 14px;font-size:13px;border:1px solid var(--bd);border-radius:var(--rs);background:none;color:var(--text2);cursor:pointer;font-weight:600;">振り返る</button></div></div>`).join('');
}

function repFB(i){cb=battles[i];showFB(cb);window.scrollTo(0,0);}
renderP();
