<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>ポケチャン対戦ノート</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#ffffff;--bg2:#f5f5f5;--bg3:#eeeeee;
  --text:#111111;--text2:#555555;--text3:#999999;
  --border:#dddddd;--border2:#bbbbbb;
  --green:#3b7a1e;--green-bg:#eaf3de;
  --red:#a32d2d;--red-bg:#fcebeb;
  --radius:10px;--radius-sm:6px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:15px;min-height:100vh;}
.tab-bar{display:flex;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:10;}
.tab{flex:1;padding:12px 4px;font-size:13px;text-align:center;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;}
.tab.active{color:var(--text);border-bottom-color:var(--text);font-weight:600;}
.sec{display:none;padding:16px 14px 80px;}
.sec.active{display:block;}
.lbl{font-size:12px;color:var(--text2);margin-bottom:4px;margin-top:10px;display:block;}
input[type=text],select,textarea{width:100%;font-size:15px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);margin-bottom:2px;-webkit-appearance:none;appearance:none;}
input[type=text]:focus,select:focus,textarea:focus{outline:none;border-color:var(--border2);}
textarea{resize:none;line-height:1.5;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn{width:100%;padding:12px;font-size:15px;font-weight:600;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg2);color:var(--text);cursor:pointer;margin-top:10px;-webkit-tap-highlight-color:transparent;}
.btn:active{opacity:0.7;}
.btn-primary{background:var(--text);color:var(--bg);}
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;}
.poke-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;-webkit-tap-highlight-color:transparent;cursor:pointer;}
.poke-card.selected{border-color:#333;background:var(--bg2);}
.poke-name{font-size:15px;font-weight:600;color:var(--text);}
.poke-sub{font-size:12px;color:var(--text2);margin-top:2px;line-height:1.5;}
.dot{width:12px;height:12px;border-radius:50%;background:var(--border);flex-shrink:0;transition:background 0.15s;}
.dot.on{background:var(--green);}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;}
.chip{font-size:13px;padding:7px 14px;border-radius:99px;border:1px solid var(--border);color:var(--text2);cursor:pointer;background:var(--bg);-webkit-tap-highlight-color:transparent;}
.chip.on{background:var(--bg2);color:var(--text);border-color:var(--border2);font-weight:600;}
.chip:active{opacity:0.6;}
.turn-block{border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:10px;}
.turn-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.turn-num{font-size:13px;font-weight:600;color:var(--text2);}
.del-btn{background:none;border:none;color:var(--text3);font-size:18px;cursor:pointer;padding:0;width:auto;line-height:1;}
.result-box{background:var(--bg2);border-radius:var(--radius);padding:14px;font-size:14px;line-height:1.8;color:var(--text);white-space:pre-wrap;margin-top:10px;}
.spin{display:inline-block;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.badge{display:inline-block;font-size:12px;padding:3px 10px;border-radius:99px;font-weight:600;margin-right:6px;}
.badge-win{background:var(--green-bg);color:var(--green);}
.badge-lose{background:var(--red-bg);color:var(--red);}
.badge-draw{background:var(--bg2);color:var(--text2);}
.hist-item{border-bottom:1px solid var(--border);padding:12px 0;}
.hist-item:last-child{border-bottom:none;}
.empty-hint{text-align:center;color:var(--text3);font-size:14px;padding:2rem 0;}
.section-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:10px;}
.add-turn-btn{width:auto;padding:6px 14px;font-size:13px;border:1px dashed var(--border2);border-radius:var(--radius-sm);background:none;color:var(--text2);cursor:pointer;}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.api-key-bar{background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 14px;font-size:13px;display:flex;gap:8px;align-items:center;}
.api-key-bar input{flex:1;font-size:13px;padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);}
.api-key-bar button{white-space:nowrap;padding:6px 12px;font-size:13px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);cursor:pointer;}
</style>
</head>
<body>

<div class="api-key-bar">
  <input type="text" id="api-key" placeholder="Anthropic APIキーを入力（sk-ant-...）" autocomplete="off">
  <button onclick="saveKey()">保存</button>
</div>

<div class="tab-bar">
  <div class="tab active" onclick="sw('party')">パーティ</div>
  <div class="tab" onclick="sw('battle')">対戦中</div>
  <div class="tab" onclick="sw('fb')">フィードバック</div>
</div>

<!-- パーティ -->
<div id="party" class="sec active">
  <div id="party-list"><div class="empty-hint">ポケモンを登録してください</div></div>
  <div class="card" style="margin-top:4px;">
    <div class="section-title">ポケモンを追加</div>
    <span class="lbl">名前</span>
    <input type="text" id="p-name" placeholder="例：ミミッキュ">
    <div class="row2">
      <div><span class="lbl">持ち物</span><input type="text" id="p-item" placeholder="例：いのちのたま"></div>
      <div><span class="lbl">性格</span><input type="text" id="p-nature" placeholder="例：やんちゃ"></div>
    </div>
    <span class="lbl">技（カンマ区切りで最大4つ）</span>
    <input type="text" id="p-moves" placeholder="例：シャドークロー,じゃれつく,呪い,影うち">
    <span class="lbl">役割メモ（省略OK）</span>
    <input type="text" id="p-role" placeholder="例：積みエース">
    <button class="btn" onclick="addPoke()">+ 追加する</button>
  </div>
</div>

<!-- 対戦中 -->
<div id="battle" class="sec">
  <div class="section-title">1. 選出する3匹を選択</div>
  <div id="sent-list"></div>

  <div style="margin:12px 0;">
    <span class="lbl">結果</span>
    <div class="chip-row">
      <span class="chip on" id="res-win" onclick="setResult('win')">勝ち</span>
      <span class="chip" id="res-lose" onclick="setResult('lose')">負け</span>
      <span class="chip" id="res-draw" onclick="setResult('draw')">引き分け</span>
    </div>
  </div>

  <div class="header">
    <div class="section-title" style="margin:0;">2. ターンを記録</div>
    <button class="add-turn-btn" onclick="addTurn()">+ ターン追加</button>
  </div>
  <div id="turns"></div>
  <button class="btn btn-primary" onclick="saveAndGo()" style="margin-top:12px;">保存してフィードバックへ</button>
</div>

<!-- フィードバック -->
<div id="fb" class="sec">
  <div id="fb-empty" class="empty-hint">対戦を記録するとここに表示されます</div>
  <div id="fb-content" style="display:none;">
    <div id="fb-summary" class="card" style="font-size:14px;line-height:1.7;"></div>
    <button class="btn btn-primary" onclick="runFeedback()">AIにフィードバックしてもらう</button>
    <div id="fb-result"></div>
  </div>
  <div id="hist-wrap" style="margin-top:20px;"></div>
</div>

<script>
let party = JSON.parse(localStorage.getItem('party')||'[]');
let battles = JSON.parse(localStorage.getItem('battles')||'[]');
let sentIdx = [];
let result = 'win';
let turns = [];
let turnIdx = 0;
let currentBattle = null;

function saveKey() {
  const k = document.getElementById('api-key').value.trim();
  if(!k){alert('APIキーを入力してください');return;}
  localStorage.setItem('apikey', k);
  alert('保存しました！');
}

window.onload = () => {
  const k = localStorage.getItem('apikey');
  if(k) document.getElementById('api-key').value = k;
  renderParty();
};

function sw(id) {
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['party','battle','fb'][i]===id));
  document.querySelectorAll('.sec').forEach(s=>s.classList.toggle('active',s.id===id));
  if(id==='battle'){sentIdx=[];renderSentList();}
  if(id==='fb') renderHist();
}

function addPoke() {
  const name = document.getElementById('p-name').value.trim();
  if(!name){alert('名前を入力してください');return;}
  if(party.length>=6){alert('6匹までです');return;}
  const moves = document.getElementById('p-moves').value.split(',').map(m=>m.trim()).filter(Boolean);
  party.push({name, item:document.getElementById('p-item').value.trim(), nature:document.getElementById('p-nature').value.trim(), moves, role:document.getElementById('p-role').value.trim()});
  ['p-name','p-item','p-nature','p-moves','p-role'].forEach(id=>document.getElementById(id).value='');
  localStorage.setItem('party', JSON.stringify(party));
  renderParty();
}

function removePoke(i){party.splice(i,1);localStorage.setItem('party',JSON.stringify(party));renderParty();}

function renderParty() {
  const el = document.getElementById('party-list');
  if(!party.length){el.innerHTML='<div class="empty-hint">ポケモンを登録してください</div>';return;}
  el.innerHTML = party.map((p,i)=>`
    <div class="poke-card" style="cursor:default;">
      <div style="flex:1;">
        <div class="poke-name">${p.name}</div>
        <div class="poke-sub">${[p.item,p.nature].filter(Boolean).join(' / ')}</div>
        ${p.moves.length?`<div class="poke-sub">${p.moves.join('　')}</div>`:''}
        ${p.role?`<div class="poke-sub" style="color:var(--text3);">${p.role}</div>`:''}
      </div>
      <button class="del-btn" onclick="removePoke(${i})">×</button>
    </div>`).join('');
}

function renderSentList() {
  const el = document.getElementById('sent-list');
  if(!party.length){el.innerHTML='<div class="empty-hint">先にパーティを登録してください</div>';return;}
  el.innerHTML = party.map((p,i)=>`
    <div class="poke-card ${sentIdx.includes(i)?'selected':''}" onclick="toggleSent(${i})">
      <div class="dot ${sentIdx.includes(i)?'on':''}"></div>
      <div style="flex:1;">
        <div class="poke-name">${p.name}</div>
        <div class="poke-sub">${[p.item,p.nature].filter(Boolean).join(' / ')}</div>
      </div>
      ${sentIdx.includes(i)?`<span style="font-size:13px;color:var(--text2);">${sentIdx.indexOf(i)+1}番手</span>`:''}
    </div>`).join('');
}

function toggleSent(i) {
  const idx = sentIdx.indexOf(i);
  if(idx===-1){if(sentIdx.length<3)sentIdx.push(i);}
  else sentIdx.splice(idx,1);
  renderSentList();
  rerenderTurnSelects();
}

function setResult(r) {
  result = r;
  ['win','lose','draw'].forEach(k=>document.getElementById(`res-${k}`).classList.toggle('on',k===r));
}

const QUICK = ['交代','守る','剣の舞','竜の舞','テラスタル','メガシンカ','Zワザ','ダイマ','挑発'];

function addTurn() {
  turnIdx++;
  const n = turnIdx;
  turns.push({id:n, myPoke:'', move:'', oppPoke:'', note:''});
  const div = document.createElement('div');
  div.className='turn-block';
  div.id=`tb-${n}`;
  const sentPokes = sentIdx.map(i=>party[i]);
  const pokeOpts = sentPokes.map(p=>`<option value="${p.name}">${p.name}</option>`).join('');
  div.innerHTML=`
    <div class="turn-hd">
      <span class="turn-num">ターン ${n}</span>
      <button class="del-btn" onclick="removeTurn(${n})">×</button>
    </div>
    <div class="row2">
      <div>
        <span class="lbl">自分のポケモン</span>
        <select id="t${n}-my" onchange="updateMoveSelect(${n})">
          <option value="">選択</option>${pokeOpts}
        </select>
      </div>
      <div>
        <span class="lbl">使った技</span>
        <select id="t${n}-move">
          <option value="">先に選択</option>
        </select>
      </div>
    </div>
    <span class="lbl">相手のポケモン</span>
    <input type="text" id="t${n}-op" placeholder="例：ガブリアス" oninput="saveTurn(${n})">
    <span class="lbl">メモ（省略OK）</span>
    <textarea id="t${n}-note" rows="2" placeholder="例：スカーフ読んで先制できると思った" oninput="saveTurn(${n})"></textarea>
  `;
  document.getElementById('turns').appendChild(div);
  div.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function buildMoveOpts(poke) {
  if(!poke||!poke.moves.length) return '';
  return poke.moves.map(m=>`<option value="${m}">${m}</option>`).join('');
}

function updateMoveSelect(n) {
  const pokeName = document.getElementById(`t${n}-my`).value;
  const poke = party.find(p=>p.name===pokeName);
  const sel = document.getElementById(`t${n}-move`);
  sel.innerHTML = poke&&poke.moves.length
    ? `<option value="">選択</option>`+buildMoveOpts(poke)
    : `<option value="">技なし</option>`;
  saveTurn(n);
}

function rerenderTurnSelects() {
  turns.forEach(t => {
    const mySel = document.getElementById(`t${t.id}-my`);
    if(!mySel) return;
    const sentPokes = sentIdx.map(i=>party[i]);
    const cur = mySel.value;
    mySel.innerHTML = `<option value="">選択</option>`+sentPokes.map(p=>`<option value="${p.name}"${p.name===cur?' selected':''}>${p.name}</option>`).join('');
    updateMoveSelect(t.id);
  });
}

function removeTurn(n) {
  turns = turns.filter(t=>t.id!==n);
  document.getElementById(`tb-${n}`)?.remove();
}

function saveTurn(n) {
  const t = turns.find(t=>t.id===n);
  if(!t) return;
  t.myPoke = document.getElementById(`t${n}-my`)?.value||'';
  t.move   = document.getElementById(`t${n}-move`)?.value||'';
  t.oppPoke= document.getElementById(`t${n}-op`)?.value.trim()||'';
  t.note   = document.getElementById(`t${n}-note`)?.value.trim()||'';
}

function saveAndGo() {
  turns.forEach(t=>saveTurn(t.id));
  const b = {
    id: Date.now(),
    date: new Date().toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}),
    result,
    sent: sentIdx.map(i=>party[i]),
    party: party.map(p=>({...p,moves:[...p.moves]})),
    turns: turns.filter(t=>t.myPoke||t.oppPoke||t.move)
  };
  battles.unshift(b);
  if(battles.length>50) battles = battles.slice(0,50);
  localStorage.setItem('battles', JSON.stringify(battles));
  currentBattle = b;
  document.getElementById('turns').innerHTML='';
  turns=[]; turnIdx=0; sentIdx=[];
  showFb(b);
  sw('fb');
}

function showFb(b) {
  document.getElementById('fb-empty').style.display='none';
  document.getElementById('fb-content').style.display='block';
  document.getElementById('fb-result').innerHTML='';
  const rl={win:'勝ち',lose:'負け',draw:'引き分け'};
  const rc={win:'badge-win',lose:'badge-lose',draw:'badge-draw'};
  const sentNames = b.sent.map(p=>p.name).join('、');
  document.getElementById('fb-summary').innerHTML =
    `<span class="badge ${rc[b.result]}">${rl[b.result]}</span>`+
    (sentNames?`選出：${sentNames}　`:'')+
    `${b.turns.length}ターン記録　${b.date}`;
}

async function runFeedback() {
  const apiKey = localStorage.getItem('apikey');
  if(!apiKey){alert('APIキーを入力してください（画面上部）');return;}
  if(!currentBattle) return;
  const b = currentBattle;
  const el = document.getElementById('fb-result');
  el.innerHTML='<div class="result-box"><span class="spin">⟳</span> 分析中...</div>';
  const rl={win:'勝ち',lose:'負け',draw:'引き分け'};
  const partyText = b.party.map(p=>`・${p.name}（持ち物：${p.item||'なし'}、性格：${p.nature||'不明'}、技：${p.moves.join('/')||'不明'}、役割：${p.role||'不明'}）`).join('\n');
  const sentText = b.sent.map(p=>`${p.name}（${[p.item,p.nature].filter(Boolean).join('・')}）`).join('、');
  const turnText = b.turns.map(t=>`T${t.id}：自分=${t.myPoke||'?'}で${t.move||'?'}、相手=${t.oppPoke||'?'}${t.note?'　メモ：'+t.note:''}`).join('\n');
  const prompt = `ポケモンチャンピオンズの対戦を初心者向けに振り返ってください。

【結果】${rl[b.result]}
【自分のパーティ】
${partyText}
【今回の選出】${sentText||'不明'}
【ターンの流れ】
${turnText||'記録なし'}

以下の3点でフィードバックしてください。難しい専門用語は使わず、初心者が「なるほど」と感じられるやさしい言葉でお願いします：

▼ ターンごとの行動について
各ターンの技選択が良かった点・こうすればよかった点を一言ずつ

▼ 選出について
その3匹の選出が良かった理由、またはこうすればよかったという提案

▼ 次に1つだけ意識すること
次の対戦でこれだけ意識すればOKなことを1つ、シンプルに`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:prompt}]})
    });
    const data = await res.json();
    if(data.error){el.innerHTML=`<div class="result-box">エラー：${data.error.message}</div>`;return;}
    const text = data.content?.find(c=>c.type==='text')?.text||'エラーが発生しました';
    el.innerHTML=`<div class="result-box">${text}</div>`;
    battles[0].feedback = text;
    localStorage.setItem('battles', JSON.stringify(battles));
  } catch(e){
    el.innerHTML='<div class="result-box">通信エラーが発生しました。APIキーとネット接続を確認してください。</div>';
  }
}

function renderHist() {
  const el = document.getElementById('hist-wrap');
  const toShow = battles.slice(currentBattle?1:0);
  if(!toShow.length){el.innerHTML='';return;}
  const rl={win:'勝ち',lose:'負け',draw:'引き分け'};
  const rc={win:'badge-win',lose:'badge-lose',draw:'badge-draw'};
  el.innerHTML='<div style="font-size:13px;color:var(--text3);margin-bottom:8px;">過去の対戦</div>'+
    toShow.map((b,i)=>`
    <div class="hist-item">
      <span class="badge ${rc[b.result]}">${rl[b.result]}</span>
      <span style="font-size:14px;">選出：${b.sent.map(p=>p.name).join('、')||'不明'}</span>
      <span style="font-size:12px;color:var(--text3);margin-left:6px;">${b.date}</span>
      <div>
        <button onclick="replayFb(${currentBattle?i+1:i})" style="margin-top:8px;width:auto;padding:5px 12px;font-size:13px;border:1px solid var(--border);border-radius:var(--radius-sm);background:none;color:var(--text2);cursor:pointer;">振り返る</button>
      </div>
    </div>`).join('');
}

function replayFb(i){currentBattle=battles[i];showFb(currentBattle);window.scrollTo(0,0);}

renderParty();
</script>
</body>
</html>
